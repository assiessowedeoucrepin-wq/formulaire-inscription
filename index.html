<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription scolaire en ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulaire d'inscription</h1>
    <div class="carte">
        <form action="#" method="#">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" placeholder="veuillez saisir votre nom">

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" placeholder="veuillez saisir votre prénom">

            <label for="ecole_origine">École d'origine :</label>
            <input type="text" id="ecole_origine" name="ecole_origine" placeholder="Veuillez donner votre école de provenance">

            <label for="telephone">Téléphone :</label>
            <input type="tel" id="telephone" name="telephone" placeholder="veuillez saisir votre numéro de téléphone">

            

            <label for="moyenne">Moyenne :</label>
            <input type="number" id="moyenne" name="moyenne" placeholder="veuillez donner votre moyenne" min="0" max="20" step="0.01">

            <input type="submit" value="Envoyer ma demande">
        </form>
    </div>
</body>
</html>
